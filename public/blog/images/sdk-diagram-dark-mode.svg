<svg width="1280" height="1310" viewBox="0 0 1280 1310" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF9933"/>
    </marker>
  </defs>

  <!-- 1. Kronk Model Server (orange band) -->
  <rect x="60" y="60" width="1160" height="118" rx="12" fill="#FF9933" fill-opacity="0.05" stroke="#FF9933" stroke-width="1.5"/>
  <text x="640" y="128" text-anchor="middle" font-size="34" font-weight="700">
    <tspan fill="#FF9933">Kronk</tspan><tspan fill="#DEDEF2">: model server</tspan>
  </text>

  <!-- 2. Pool API (NEW orange band) -->
  <rect x="60" y="208" width="1160" height="118" rx="12" fill="#FF9933" fill-opacity="0.05" stroke="#FF9933" stroke-width="1.5"/>
  <text x="640" y="276" text-anchor="middle" font-size="34" font-weight="700" fill="#FF9933">Pool API</text>

  <!-- 3a. SDK Tools container -->
  <rect x="60" y="356" width="900" height="240" rx="12" fill="#14171F" stroke="#4E5B7F" stroke-width="2"/>
  <text x="510" y="400" text-anchor="middle" font-size="28" font-weight="700" fill="#DEDEF2">SDK Tools</text>

  <!-- 3a.i Models API -->
  <rect x="100" y="430" width="190" height="140" rx="10" fill="#0E1016" stroke="#4E5B7F" stroke-width="1.5"/>
  <text x="195" y="498" text-anchor="middle" font-size="22" font-weight="600" fill="#DEDEF2">Models</text>
  <text x="195" y="528" text-anchor="middle" font-size="22" font-weight="600" fill="#DEDEF2">API</text>

  <!-- 3a.ii Libs API -->
  <rect x="312" y="430" width="190" height="140" rx="10" fill="#0E1016" stroke="#4E5B7F" stroke-width="1.5"/>
  <text x="407" y="498" text-anchor="middle" font-size="22" font-weight="600" fill="#DEDEF2">Libs</text>
  <text x="407" y="528" text-anchor="middle" font-size="22" font-weight="600" fill="#DEDEF2">API</text>

  <!-- 3a.iii Devices API -->
  <rect x="524" y="430" width="190" height="140" rx="10" fill="#0E1016" stroke="#4E5B7F" stroke-width="1.5"/>
  <text x="619" y="498" text-anchor="middle" font-size="22" font-weight="600" fill="#DEDEF2">Devices</text>
  <text x="619" y="528" text-anchor="middle" font-size="22" font-weight="600" fill="#DEDEF2">API</text>

  <!-- 3a.iv Defaults API -->
  <rect x="736" y="430" width="190" height="140" rx="10" fill="#0E1016" stroke="#4E5B7F" stroke-width="1.5"/>
  <text x="831" y="498" text-anchor="middle" font-size="22" font-weight="600" fill="#DEDEF2">Defaults</text>
  <text x="831" y="528" text-anchor="middle" font-size="22" font-weight="600" fill="#DEDEF2">API</text>

  <!-- 3b. Kronk SDK API (orange box on right) -->
  <rect x="982" y="356" width="238" height="240" rx="12" fill="#FF9933" fill-opacity="0.05" stroke="#FF9933" stroke-width="1.5"/>
  <text x="1101" y="464" text-anchor="middle" font-size="26" font-weight="700" fill="#FF9933">Kronk</text>
  <text x="1101" y="500" text-anchor="middle" font-size="26" font-weight="700" fill="#FFC177">SDK API</text>

  <!-- 4. Model SDK API (gray band) -->
  <rect x="60" y="626" width="1160" height="118" rx="12" fill="#14171F" stroke="#4E5B7F" stroke-width="2"/>
  <text x="640" y="694" text-anchor="middle" font-size="30" font-weight="700" fill="#DEDEF2">Model SDK API</text>

  <!-- 5. YZMA: Non-CGO API (purple section) -->
  <rect x="60" y="774" width="1160" height="290" rx="12" fill="#B699FF" fill-opacity="0.05" stroke="#B699FF" stroke-width="1.5"/>
  <text x="640" y="820" text-anchor="middle" font-size="28" font-weight="700" fill="#D7B8FF">YZMA: Non-CGO API</text>

  <!-- 5a. FFI sub-card -->
  <rect x="120" y="852" width="1040" height="78" rx="10" fill="#0E1016" stroke="#B699FF" stroke-width="1"/>
  <text x="640" y="900" text-anchor="middle" font-size="26" font-weight="700" fill="#D7B8FF">FFI</text>

  <!-- 5b. PUREGO sub-card -->
  <rect x="120" y="952" width="1040" height="78" rx="10" fill="#0E1016" stroke="#B699FF" stroke-width="1"/>
  <text x="640" y="1000" text-anchor="middle" font-size="26" font-weight="700" fill="#D7B8FF">PUREGO</text>

  <!-- 6. llama.cpp (blue band) -->
  <rect x="60" y="1094" width="1160" height="100" rx="12" fill="#14171F" stroke="#689DFF" stroke-width="1.5"/>
  <text x="640" y="1152" text-anchor="middle" font-size="28" font-weight="700" fill="#A6C4FF">llama.cpp</text>

  <!-- 7. Three Model boxes -->
  <rect x="60" y="1224" width="380" height="76" rx="10" fill="#14171F" stroke="#4E5B7F" stroke-width="1.5"/>
  <text x="250" y="1270" text-anchor="middle" font-size="24" font-weight="700" fill="#DEDEF2">Model</text>

  <rect x="450" y="1224" width="380" height="76" rx="10" fill="#14171F" stroke="#4E5B7F" stroke-width="1.5"/>
  <text x="640" y="1270" text-anchor="middle" font-size="24" font-weight="700" fill="#DEDEF2">Model</text>

  <rect x="840" y="1224" width="380" height="76" rx="10" fill="#14171F" stroke="#4E5B7F" stroke-width="1.5"/>
  <text x="1030" y="1270" text-anchor="middle" font-size="24" font-weight="700" fill="#DEDEF2">Model</text>

  <!-- ============================ Arrows ============================ -->

  <!-- Kronk Model Server -> Pool API (left side, dashed orange) -->
  <line x1="195" y1="178" x2="195" y2="206" stroke="#FF9933" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow-orange)"/>

  <!-- Pool API -> Models API (left side) -->
  <line x1="195" y1="326" x2="195" y2="428" stroke="#FF9933" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow-orange)"/>

  <!-- Kronk Model Server -> Kronk SDK API (right side, passes over Pool band visually) -->
  <line x1="1101" y1="178" x2="1101" y2="354" stroke="#FF9933" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow-orange)"/>

  <!-- Models API -> Model SDK API (left side) -->
  <line x1="195" y1="572" x2="195" y2="624" stroke="#FF9933" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow-orange)"/>

  <!-- Kronk SDK API -> Model SDK API (right side) -->
  <line x1="1101" y1="598" x2="1101" y2="624" stroke="#FF9933" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow-orange)"/>

  <!-- Model SDK API -> YZMA (middle) -->
  <line x1="640" y1="746" x2="640" y2="772" stroke="#FF9933" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow-orange)"/>

  <!-- PUREGO -> llama.cpp (middle) -->
  <line x1="640" y1="1032" x2="640" y2="1092" stroke="#FF9933" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow-orange)"/>
</svg>
